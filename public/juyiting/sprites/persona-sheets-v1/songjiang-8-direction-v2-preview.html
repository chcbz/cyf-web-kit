<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>宋江八方向行走预览</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; background: #172018; color: #eef6e8; }
      main { max-width: 920px; margin: 0 auto; padding: 28px 18px 40px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 24px; color: #b9c6b7; line-height: 1.6; }
      #preview { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 14px; }
      article { display: grid; justify-items: center; gap: 8px; padding: 14px; border: 1px solid #38503a; border-radius: 12px; background: #223025; }
      canvas { width: 128px; height: 128px; border-radius: 8px; background: #2c7b39; image-rendering: auto; }
      strong { font-size: 15px; }
      span { color: #a5b7a2; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>宋江八方向行走预览</h1>
      <p>每个方向均以 90ms 播放四帧：左脚前 → 收脚 → 右脚前 → 收脚。</p>
      <section id="preview" aria-label="宋江八方向行走动画"></section>
    </main>
    <script>
      const sheet = new Image()
      sheet.src = './songjiang-8-direction-v2.png'

      const directions = [
        ['正面', 4, 0], ['右前斜', 4, 4], ['右侧', 5, 0], ['右后斜', 5, 4],
        ['背面', 6, 0], ['左后斜', 6, 4], ['左侧', 7, 0], ['左前斜', 7, 4],
      ]
      const entries = directions.map(([name, row, start]) => {
        const card = document.createElement('article')
        const canvas = document.createElement('canvas')
        const label = document.createElement('strong')
        const detail = document.createElement('span')
        canvas.width = 128
        canvas.height = 128
        label.textContent = name
        detail.textContent = '左脚前 → 收脚 → 右脚前 → 收脚'
        card.append(canvas, label, detail)
        document.querySelector('#preview').append(card)
        return { canvas, context: canvas.getContext('2d'), row, start }
      })

      const render = (time) => {
        const frame = Math.floor(time / 90) % 4
        for (const { canvas, context, row, start } of entries) {
          context.clearRect(0, 0, canvas.width, canvas.height)
          context.drawImage(sheet, (start + frame) * 128, row * 128, 128, 128, 0, 0, 128, 128)
        }
        requestAnimationFrame(render)
      }
      sheet.addEventListener('load', () => requestAnimationFrame(render))
    </script>
  </body>
</html>
